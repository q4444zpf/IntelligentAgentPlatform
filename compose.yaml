services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MODEL_PROVIDER_DATABASE: /data/model-providers.db
    volumes:
      - model-provider-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  model-provider-data:
